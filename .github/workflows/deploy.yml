name: Deploy to AWS

on:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.CEE_HOST }}
          username: ${{ secrets.CEE_USER }}
          key: ${{ secrets.CEE_SSH_KEY }}
          script: |
            cd /home/ubuntu/Code-Execution-Engine
            git fetch origin
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
